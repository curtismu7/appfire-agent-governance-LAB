# OrbStack:  HOST_PORT=7814 docker compose up --build -d   ->  http://127.0.0.1:7814
# The server binds 0.0.0.0 INSIDE the container (CALAB_BIND is the opt-in), but the port is published on loopback only.
# Do not change the 127.0.0.1 below. HOST_PORT must stay in 7814-7839 (7814 is both the host-run and the Docker default).
# ALLOW_MOCK_SIGNIN=1 is the owner's opt-in to the mock persona sign-in; AAG_PUBLISH=loopback tells the guards that the publish above is loopback-only
# (a test pins both). Remove ALLOW_MOCK_SIGNIN to turn mock sign-in off.
# Settings: the app's own .env beside this file (copy .env.example). Compose reads it only to fill the ${...} values below (a missing .env is fine).
# There is deliberately no env_file (it would copy every .env line into the container): only the names listed below go in, and a test pins that list.
# Real (owner, 2026-11-10, option a): the four PINGONE_* names are passed by substitution and AAG_LIVE_FROM_ENV=1 tells the server to take them from
# the environment (the image has no .env, .dockerignore). Real is available when they are complete; with none of them the lab is Mock with Real disabled.
# Full Real (owner, 2026-11-10): the eight AAG_* names (user app, agent app, demo username, Agent Gateway URL, audience, scope) plus
# PINGONE_ENVIRONMENT_ID and PINGONE_REGION, by the same substitution. When any AAG_* name is set, the old PINGONE_CLIENT_* worker client is ignored.
# AAG_AGENT_SCOPE (optional, empty = agent:invoke) is the one more name: the scope of the agent token and token exchange 1.
# AAG_ALLOW_LIVE=0 in .env (or the shell) is the explicit OFF switch. IDP is not pinned: each mode uses its own IdP, so the toggle switches both ways.
# AAG_DEPLOY_MODE=local is this compose file; the dormant hosted build sets hosted in its own k8s manifest.
# AAG_BRAIN_URL (owner opt-in, off by default): the local llama.cpp model on the Mac, e.g. AAG_BRAIN_URL=http://host.docker.internal:8090.
# When set, the netguard allows that one host, and the lab calls it only after a visitor picks the llama.cpp brain (a test pins the empty default).
name: appfire-agent-governance-lab

services:
  appfire-agent-governance-lab:
    build: .
    ports:
      - "127.0.0.1:${HOST_PORT:-7814}:7814"
    environment:
      SHELF_URL: ${SHELF_URL:-}
      PORT: "7814"
      CALAB_BIND: 0.0.0.0
      AAG_PUBLISH: loopback
      ALLOW_MOCK_SIGNIN: "1"
      AAG_DEPLOY_MODE: local
      AAG_LIVE_FROM_ENV: "1"
      AAG_ALLOW_LIVE: ${AAG_ALLOW_LIVE:-}
      PINGONE_ENVIRONMENT_ID: ${PINGONE_ENVIRONMENT_ID:-}
      PINGONE_REGION: ${PINGONE_REGION:-}
      PINGONE_CLIENT_ID: ${PINGONE_CLIENT_ID:-}
      PINGONE_CLIENT_SECRET: ${PINGONE_CLIENT_SECRET:-}
      AAG_USER_CLIENT_ID: ${AAG_USER_CLIENT_ID:-}
      AAG_USER_CLIENT_SECRET: ${AAG_USER_CLIENT_SECRET:-}
      AAG_AGENT_CLIENT_ID: ${AAG_AGENT_CLIENT_ID:-}
      AAG_AGENT_CLIENT_SECRET: ${AAG_AGENT_CLIENT_SECRET:-}
      AAG_DEMO_USERNAME: ${AAG_DEMO_USERNAME:-}
      AAG_AGENT_GATEWAY_URL: ${AAG_AGENT_GATEWAY_URL:-}
      AAG_GATEWAY_AUDIENCE: ${AAG_GATEWAY_AUDIENCE:-}
      AAG_GATEWAY_SCOPE: ${AAG_GATEWAY_SCOPE:-}
      AAG_AGENT_SCOPE: ${AAG_AGENT_SCOPE:-}
      AAG_LAB_MODE: ${AAG_LAB_MODE:-mock}
      AAG_BRAIN_URL: ${AAG_BRAIN_URL:-}
      LAB_ALLOWED_HOSTS: ${LAB_ALLOWED_HOSTS:-appfire-agent-governance.local.ping-devops.com}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7814/api/health').then(r=>r.json()).then(j=>process.exit(j.schema==='demo-health/1'&&j.state==='ready'?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      start_period: 5s
      start_interval: 2s
      timeout: 5s
      retries: 3
