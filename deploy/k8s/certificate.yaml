# TLS for the app's own host, issued by cert-manager through the ClusterIssuer the owner names (CLUSTER_ISSUER; no default).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: appfire-agent-governance-lab
  labels: { app: appfire-agent-governance-lab }
spec:
  secretName: appfire-agent-governance-lab-tls
  dnsNames:
    - __SE_HOST__
  issuerRef:
    kind: ClusterIssuer
    name: __CLUSTER_ISSUER__
